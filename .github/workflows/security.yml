name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  bandit:
    name: Bandit SAST scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install --no-cache-dir "bandit[toml]>=1.7.8"

      - name: Run bandit
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install --no-cache-dir --upgrade pip "pip-audit>=2.7.0"

      - name: Audit dependencies
        run: |
          # Install the project's runtime deps and audit the resolved set —
          # not the ambient environment, whose pip/setuptools/wheel are build
          # tooling, not shipped, and generate their own advisories over time.
          pip install --no-cache-dir . --no-deps
          pip install --no-cache-dir \
            "fastapi>=0.111.0" \
            "uvicorn>=0.30.0" \
            "pydantic>=2.7.0" \
            "numpy>=1.26.0" \
            "python-dotenv>=1.0.0"
          pip freeze --exclude-editable \
            | grep -viE '^(pip|setuptools|wheel)==' > audit-requirements.txt
          pip-audit -r audit-requirements.txt --format json --output pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14
